name: Backend Lint

on:
  push:
    branches: [main, develop]
    paths:
      - "server/**"
      - "*.py"
  pull_request:
    branches: [main, develop]
    paths:
      - "server/**"
      - "*.py"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy pylint

      - name: Run Black (code formatter check)
        run: |
          black --check server/ || echo "Black formatting issues found"
        continue-on-error: true

      - name: Run isort (import sorting check)
        run: |
          isort --check-only server/ || echo "Import sorting issues found"
        continue-on-error: true

      - name: Run Flake8 (style guide enforcement)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 server/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 server/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pylint
        run: |
          pylint server/ --exit-zero --max-line-length=127 --disable=C0111,C0103,R0913,R0914
        continue-on-error: true

      - name: Run MyPy (type checking)
        run: |
          mypy server/ --ignore-missing-imports || echo "MyPy type checking issues found"
        continue-on-error: true
